<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KrishiShell</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="setupSelectedRole()">

  <header class="navbar">
    <a href="../../index.html" class="logo">
      <span class="logo-icon"></span>
      KrishiShell
    </a>
    <a href="../../index.html" class="btn btn-outline btn-sm">Change Role</a>
  </header>

  <div class="container form-card-container">
    <div class="card-box">
      <h2 id="loginTitle" class="text-primary text-center">Create Farmer Account</h2>
      <p id="loginSubtitle" class="text-center text-muted" style="margin-bottom: 20px;">Create an account to continue.</p>
      
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="userName">Full Name</label>
          <input type="text" id="userName" placeholder="e.g. Shubham Jha" required>
        </div>

        <div class="form-group">
          <label for="userContact">Mobile Number</label>
          <input type="text" id="userContact" placeholder="e.g. 9876543210" required>
        </div>

        <div class="form-group">
          <label for="userPass">Password</label>
          <input type="password" id="userPass" minlength="8" placeholder="At least 8 characters" required>
        </div>

        <div id="loginMessage" class="form-message" role="alert" aria-live="polite"></div>
        <button id="authSubmit" type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>
      <p class="text-center" style="margin-top: 16px;">
        <button id="authModeToggle" type="button" class="btn btn-outline btn-sm">Already have an account? Sign in</button>
      </p>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script>
    function setupSelectedRole() {
      const params = new URLSearchParams(window.location.search);
      const titleElem = document.getElementById('loginTitle');
      if (params.get('role') === 'buyer') {
        titleElem.innerText = 'Farmer accounts only';
      }
    }
  </script>
</body>
</html>
